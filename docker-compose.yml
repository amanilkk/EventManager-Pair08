services:
  backend:
    build: .
    image: amanilkk/eventmanager-backend:latest
    container_name: eventmanager_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/events.db
    volumes:
      - events_sqlite_data:/data

  frontend:
    build: ./frontend
    image: amanilkk/eventmanager-frontend:latest
    container_name: eventmanager_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  events_sqlite_data: